# fly.toml — Genticspace Frontend
# Deploy: fly deploy --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.genticspace.com
#
# NOTE: app name below is unchanged (still "tracent-app") — the Fly app
# rename is a separate, later infra-cutover step, not part of this change.

app = "tracent-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    # Backend still accepts requests from both tracent.me and genticspace.com
    # (see fly.toml's CORS_ORIGINS) — this just picks the new domain as the
    # frontend's own build-time API target now that its cert is issued.
    NEXT_PUBLIC_API_BASE_URL = "https://api.genticspace.com"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines    = false
  min_machines_running  = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
