# fly.preview.toml — throwaway preview app for testing Sandbox Mode UI
# without touching the live tracent-app deployment/design.
# Deploy: fly deploy -c fly.preview.toml --app tracent-sandbox-preview --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.genticspace.com

app = "tracent-sandbox-preview"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

  [build.args]
    NEXT_PUBLIC_API_BASE_URL = "https://api.genticspace.com"

[http_service]
  internal_port        = 3000
  force_https          = true
  auto_stop_machines    = false
  min_machines_running  = 1

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
