name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Backend tests moved to .github/workflows/tests.yml, which runs pytest
  # against a real postgres:16 service container -- tests/conftest.py's
  # suite requires a reachable Postgres (see docs/testing.md) and no longer
  # works against the old FakeDB-mocked setup this job used to run.
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test
